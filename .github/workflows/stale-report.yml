name: Stale Docs Report

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/stale-report.py"
      - ".github/workflows/stale-report.yml"
  schedule:
    # Weekly safety net: Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stale-report
  cancel-in-progress: true

jobs:
  report:
    name: Generate stale-docs report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stale report
        id: stale
        run: |
          python3 scripts/stale-report.py --json > stale.json
          COUNT=$(python3 -c "import json; print(len(json.load(open('stale.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<__EOF__'
            if [ "$COUNT" -eq 0 ]; then
              echo "✅ No stale docs as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            else
              echo "⚠️ **$COUNT stale doc(s)** found as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
              echo ""
              echo "| Overdue | Cadence | Owner | Path |"
              echo "| ------- | ------- | ----- | ---- |"
              python3 -c "
          import json
          for d in sorted(json.load(open('stale.json')), key=lambda x: -x['overdue_days']):
              print(f\"| {d['overdue_days']}d | {d['cadence']} | {d['owner']} | \`{d['path']}\` |\")
          "
              echo ""
              echo "_Auto-generated by [stale-report workflow](../actions/workflows/stale-report.yml). Update \`last_reviewed\` in each doc's frontmatter to clear._"
            fi
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert stale-docs tracking issue
        if: steps.stale.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.stale.outputs.body }}
          COUNT: ${{ steps.stale.outputs.count }}
        with:
          script: |
            const title = `📚 Stale knowledge-base docs (${process.env.COUNT})`;
            const body = process.env.BODY;
            const label = 'stale-docs';

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'fbca04',
                description: 'Docs past their review_cadence',
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10,
            });

            if (issues.length > 0) {
              const issue = issues[0];
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, title, body,
              });
              core.notice(`Updated stale-docs issue #${issue.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
              core.notice(`Created stale-docs issue #${created.number}`);
            }

      - name: Close stale-docs issue if none remain
        if: steps.stale.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'stale-docs', per_page: 10,
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ All docs are within their review cadence. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
