name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "scripts/whats_new_hook.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Material's `social` plugin renders per-page OG preview PNGs (Slack/Teams
      # link previews). It needs Cairo + Pango + fontconfig at the OS layer.
      # `mkdocs-material[imaging]` brings the Python bindings; this step brings
      # the native libraries they wrap.
      - name: Install image libraries for social cards
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            fonts-roboto

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          # Two env vars wire up git-committers:
          #   GIT_COMMITTERS_ENABLED — turns the plugin on (mkdocs.yml).
          #   MKDOCS_GIT_COMMITTERS_APIKEY — the GitHub API token the
          #   plugin reads at runtime to look up contributors per file.
          # PR validation builds set neither, so the plugin stays off
          # and the build doesn't blow the unauthenticated 60 req/hr cap.
          GIT_COMMITTERS_ENABLED: "true"
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
